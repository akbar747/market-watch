# .github/gitleaks.toml
# gitleaks 配置（CI 步骤：`gitleaks dir . --config .github/gitleaks.toml --exit-code 1`）。
#
# 基线规则沿用 gitleaks 官方默认（不写 extend，避免版本漂移），这里只做两件事：
#   1. 把本项目里**已知的非密钥**加进 allowlist（占位域名、示例配置、文档样例）；
#   2. 加一条自定义规则，专门盯本项目最危险的那类硬编码——代理口令与 Bearer token。

[extend]
useDefault = true

[allowlist]
description = "仓库内已知的非密钥：占位联系地址、示例环境变量、文档与测试样例"

paths = [
  '''\.env\.example$''',
  '''docs/.*\.md$''',
  '''tests/.*''',
  '''README\.md$''',
]

regexes = [
  # C1 文档样例联系地址（不是密钥，是 UA 里的 contact）
  '''you\.example/contact''',
  # 本地/占位代理串
  '''MW_PROXY_URL=$''',
  # 文档与注释里出现的占位 token
  '''your[-_]?token(-here)?''',
  '''your[-_]?api[-_]?key''',
  '''<api[-_]?key>''',
  '''<token>''',
  # 单元测试里的假 UUID / 假 ingest 端点
  '''example\.com''',
  '''testcontainer''',
]

# ---- 自定义规则：本项目特有风险 ----

[[rules]]
id = "mw-proxy-credentials"
description = "代理 URL 内嵌口令（C5 明令禁止：代理凭证只能走环境变量）"
regex = '''(https?|socks5?)://[^:/\s]+:[^@/\s]+@[^\s]+'''
tags = ["key", "compliance-C5"]

[[rules]]
id = "mw-hardcoded-bearer"
description = "硬编码 Bearer / Basic 凭据"
regex = '''(?i)\b(bearer|basic)\s+[A-Za-z0-9+/=_\-]{16,}'''
tags = ["key", "token"]
